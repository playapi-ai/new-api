name: Publish fork image to GHCR

on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize releases so only one run publishes at a time.
concurrency:
  group: publish-fork-ghcr
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve image name and version
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="fork-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check out selected commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Write build version
        run: printf '%s\n' "$VERSION" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=ghcr-amd64
          cache-to: type=gha,mode=max,scope=ghcr-amd64
          provenance: mode=max
          sbom: true

      - name: Show published image
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          {
            echo '### Published new-api image'
            echo
            echo "- Version: \`$IMAGE:$VERSION\`"
            echo "- Latest: \`$IMAGE:latest\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo '- Platform: linux/amd64'
            echo
            echo 'Use the version tag in your Compose file to pin this release:'
            echo '```yaml'
            echo 'services:'
            echo '  new-api:'
            echo "    image: $IMAGE:$VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
